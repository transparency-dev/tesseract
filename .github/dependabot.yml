version: 2
updates:
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
  groups:
    all-deps:
      applies-to: version-updates
      patterns:
        - "*"
  # Ignore tessera v1.0.4 due to breaking API changes in storage/posix/antispam (removed
  # CompactionInterval/BadgerOptions).
  ignore:
    - dependency-name: "github.com/transparency-dev/tessera"
      versions: ["<= 1.0.4"]

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    all-deps:
      applies-to: version-updates
      patterns:
        - "*"

- package-ecosystem: docker
  directories:
    - /cmd/aws
    - /cmd/aws/ci
    - /cmd/gcp
    - /cmd/gcp/ci
    - /cmd/gcp/staging
    - /internal/hammer
    - /internal/hammer/ci
  schedule:
    interval: weekly
  groups:
    all-deps:
      applies-to: version-updates
      patterns:
        - "*"
